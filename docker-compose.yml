version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: miyuki_mysql
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: miyuki_db
      MYSQL_USER: miyuki_user
      MYSQL_PASSWORD: 123456
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-combined.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - miyuki-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Spring Boot Backend
  backend:
    build:
      context: ./miyuki-backend
      dockerfile: Dockerfile
    container_name: miyuki_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/miyuki_db?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQL8Dialect
      SPRING_PROFILES_ACTIVE: dev
      JWT_SECRET: your_super_secret_jwt_key_min_256_bits_long_enough_here_12345
      JWT_EXPIRATION: 86400000
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - miyuki-network

  # React Frontend
  frontend:
    build:
      context: ./miyuki-frontend
      dockerfile: Dockerfile
    container_name: miyuki_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api/v1
      VITE_APP_NAME: MiYuki Express
    depends_on:
      - backend
    networks:
      - miyuki-network

volumes:
  mysql_data:

networks:
  miyuki-network:
    driver: bridge
